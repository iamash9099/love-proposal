<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proposal Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3
                );

            min-height: 100vh;

            padding: 20px;

        }

        .container {

            max-width: 900px;

            margin: auto;

        }

        .card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.2);

        }

        h1 {

            text-align: center;

            color: #e63963;

        }

        input {

            width: 100%;

            padding: 14px;

            margin: 8px 0;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #e63963;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

        }

        .logout {

            background: #555;

        }

        .response {

            border:
                1px solid #eee;

            border-radius: 15px;

            padding: 20px;

            margin-top: 15px;

        }

        .name {

            font-size: 23px;

            font-weight: bold;

            color: #e63963;

            margin-bottom: 15px;

        }

        .answer {

            margin: 8px 0;

        }

        .hidden {

            display: none;

        }

        #status {

            text-align: center;

            margin: 15px;

        }

    </style>

</head>


<body>

<div class="container">


    <!-- LOGIN -->

    <div
        id="loginCard"
        class="card"
    >

        <h1>
            🔐 Admin Login
        </h1>

        <input
            type="email"
            id="email"
            placeholder="Admin Gmail"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="loginStatus"></div>

    </div>


    <!-- DASHBOARD -->

    <div
        id="dashboard"
        class="hidden"
    >

        <div class="card">

            <h1>
                💌 Proposal Responses
            </h1>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <div
            id="responses"
        ></div>

    </div>

</div>


<script type="module">


    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        query,
        orderBy,
        getDocs
    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

        apiKey:
            "PASTE_YOUR_API_KEY",

        authDomain:
            "love-proposal-afbdb.firebaseapp.com",

        projectId:
            "love-proposal-afbdb",

        storageBucket:
            "PASTE_YOUR_STORAGE_BUCKET",

        messagingSenderId:
            "PASTE_YOUR_MESSAGING_SENDER_ID",

        appId:
            "PASTE_YOUR_APP_ID"

    };


    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /* =========================
       LOGIN
       ========================= */

    window.login = async function() {

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;


        if (!email || !password) {

            document
                .getElementById(
                    "loginStatus"
                )
                .textContent =
                "Enter email and password.";

            return;

        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

        catch (error) {

            document
                .getElementById(
                    "loginStatus"
                )
                .textContent =
                "Login failed.";

            console.error(error);

        }

    };


    /* =========================
       LOGOUT
       ========================= */

    window.logout = async function() {

        await signOut(auth);

    };


    /* =========================
       AUTH STATE
       ========================= */

    onAuthStateChanged(
        auth,
        async function(user) {

            if (user) {

                document
                    .getElementById(
                        "loginCard"
                    )
                    .classList.add(
                        "hidden"
                    );

                document
                    .getElementById(
                        "dashboard"
                    )
                    .classList.remove(
                        "hidden"
                    );

                loadResponses();

            }

            else {

                document
                    .getElementById(
                        "loginCard"
                    )
                    .classList.remove(
                        "hidden"
                    );

                document
                    .getElementById(
                        "dashboard"
                    )
                    .classList.add(
                        "hidden"
                    );

            }

        }
    );


    /* =========================
       LOAD RESPONSES
       ========================= */

    async function loadResponses() {

        const container =
            document.getElementById(
                "responses"
            );

        container.innerHTML =
            "<p>Loading...</p>";


        try {

            const q =
                query(

                    collection(
                        db,
                        "proposalResponses"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );


            const snapshot =
                await getDocs(q);


            container.innerHTML = "";


            if (snapshot.empty) {

                container.innerHTML =
                    "<div class='card'>" +
                    "No responses yet ❤️" +
                    "</div>";

                return;

            }


            snapshot.forEach(
                function(doc) {

                    const data =
                        doc.data();


                    let time =
                        "Time unavailable";


                    if (
                        data.createdAt
                    ) {

                        time =
                            data.createdAt
                                .toDate()
                                .toLocaleString();

                    }


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "card response";


                    div.innerHTML = `

                        <div class="name">
                            💌 ${escapeHTML(
                                data.girlName
                            )}
                        </div>

                        <div class="answer">
                            ❤️ Do You Love Me?
                            <strong>
                                ${escapeHTML(
                                    data.loveAnswer
                                )}
                            </strong>
                        </div>

                        <div class="answer">
                            💕 Stay By My Side?
                            <strong>
                                ${escapeHTML(
                                    data.foreverAnswer
                                )}
                            </strong>
                        </div>

                        <div class="answer">
                            💍 Will You Marry Me?
                            <strong>
                                ${escapeHTML(
                                    data.marriageAnswer
                                )}
                            </strong>
                        </div>

                        <div class="answer">
                            🕐 ${time}
                        </div>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );

        }

        catch (error) {

            console.error(error);

            container.innerHTML =
                "<div class='card'>" +
                "Could not load responses." +
                "</div>";

        }

    }


    /* =========================
       SAFE TEXT
       ========================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>

</body>

</html>
